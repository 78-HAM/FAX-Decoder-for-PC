name: Build Platforms

on:
  push:
    branches: [ test-cpp ]
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-amd64
            os: ubuntu-latest
            arch: x86_64
            shell: bash
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            shell: bash
          - name: windows-amd64
            os: windows-latest
            msystem: MINGW64
            arch: x86_64
            shell: msys2 {0}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            mingw-w64-${{ matrix.arch }}-toolchain
            mingw-w64-${{ matrix.arch }}-cmake
            mingw-w64-${{ matrix.arch }}-ninja
            mingw-w64-${{ matrix.arch }}-pkgconf
            mingw-w64-${{ matrix.arch }}-glfw
            mingw-w64-${{ matrix.arch }}-portaudio
            mingw-w64-${{ matrix.arch }}-curl
            mingw-w64-${{ matrix.arch }}-nsis
            zip

      - name: Setup Linux Deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libglfw3-dev libgl1-mesa-dev portaudio19-dev libcurl4-openssl-dev zip

      - name: Configure and Build
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          mkdir -p dist
          # 拷贝 exe
          cp build/bin/*.exe dist/ 2>/dev/null || cp build/*.exe dist/ 2>/dev/null || true
          
          # 拷贝 DLL
          ldd dist/*.exe 2>/dev/null | awk '/=>/ {print $3}' | grep -i "mingw" | while read dll; do cp "$dll" dist/ 2>/dev/null; done || true
          
          # 生成安装包
          cd build
          cpack -G NSIS
          
          echo "=== CPack Output ==="
          ls -la *.exe || echo "No installer generated!"
          
          # 强制把 build 目录下的所有 exe 拷贝到 dist
          cp *.exe ../dist/ 2>/dev/null || true
          cd ..
          
          # 拷贝资源目录到便携版
          if [ -d "resources" ]; then cp -r resources dist/; fi
          
          echo "=== Final dist folder ==="
          ls -la dist/
          
          # 打包便携版
          cd dist 
          zip -9 ../fax-decoder-windows-${{ matrix.arch }}-portable.zip *
          cd ..
          
      - name: Package Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p dist
          cp build/bin/* dist/ 2>/dev/null || cp build/fax_decoder dist/ 2>/dev/null || true
          if [ -d "resources" ]; then cp -r resources dist/; fi
          cd dist && zip -9 ../fax-decoder-linux-${{ matrix.arch }}.zip *
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fax-decoder-${{ matrix.name }}
          path: fax-decoder-*.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fax-decoder-*.zip
