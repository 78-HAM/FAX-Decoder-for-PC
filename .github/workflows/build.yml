name: Build Platforms

on:
  push:
    branches: [ test-cpp ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-amd64
            os: ubuntu-latest
            arch: x86_64
            shell: bash
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            shell: bash
          - name: windows-amd64
            os: windows-latest
            msystem: MINGW64
            arch: x86_64
            shell: msys2 {0}
          - name: windows-x86
            os: windows-latest
            msystem: MINGW32
            arch: i686
            shell: msys2 {0}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            mingw-w64-${{ matrix.arch }}-toolchain
            mingw-w64-${{ matrix.arch }}-cmake
            mingw-w64-${{ matrix.arch }}-ninja
            mingw-w64-${{ matrix.arch }}-pkgconf
            mingw-w64-${{ matrix.arch }}-portaudio
            mingw-w64-${{ matrix.arch }}-curl
            zip
            ${{ matrix.arch == 'x86_64' && 'mingw-w64-x86_64-glfw mingw-w64-x86_64-nsis' || 'mingw-w64-x86_64-nsis' }}

      # 专门为 32 位 Windows 手动编译 GLFW
      - name: Build GLFW for x86
        if: startsWith(matrix.os, 'windows') && matrix.arch == 'i686'
        run: |
          git clone --depth 1 --branch 3.3.9 https://github.com/glfw/glfw.git
          cd glfw
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF -DCMAKE_INSTALL_PREFIX=/mingw32
          cmake --build build --parallel
          cmake --install build
          cd ..

      - name: Setup Linux Deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libglfw3-dev libgl1-mesa-dev portaudio19-dev libcurl4-openssl-dev zip

      - name: Configure and Build
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          mkdir -p dist
          cp build/bin/*.exe dist/ || cp build/*.exe dist/
          if [ -d "fount" ]; then cp -r fount dist/; fi
          
          # 抓取 mingw 运行库 DLL
          ldd dist/*.exe | awk '/=>/ {print $3}' | grep -i "mingw" | while read dll; do cp "$dll" dist/; done
          
          # 生成 NSIS 安装包 (使用 64 位 nsis 打包)
          cd build
          cpack -G NSIS
          cp *.exe ../dist/ || true
          cd ..
          
          # 打包便携版 ZIP
          cd dist 
          zip -9 ../fax-decoder-windows-${{ matrix.arch }}-portable.zip *
          cd ..
          
      - name: Package Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p dist
          cp build/bin/* dist/ || cp build/fax_decoder dist/
          if [ -d "fount" ]; then cp -r fount dist/; fi
          cd dist && zip -9 ../fax-decoder-linux-${{ matrix.arch }}.zip *
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fax-decoder-${{ matrix.name }}
          path: fax-decoder-*.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fax-decoder-*.zip
