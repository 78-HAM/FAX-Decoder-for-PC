name: Build Windows Installer

on:
  push:
    branches: [ test-cpp ]
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  build-installer:
    name: Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-nsis

      - name: Configure and Build
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Create Installer
        run: |
          # 准备安装素材目录
          mkdir -p build/dist
          cp build/bin/*.exe build/dist/ 2>/dev/null || cp build/*.exe build/dist/ 2>/dev/null || true
          if [ -d "resources" ]; then cp -r resources build/dist/; fi
          
          # 强制收集依赖 DLL
          ldd build/dist/*.exe 2>/dev/null | awk '/=>/ {print $3}' | grep -i "mingw" | while read dll; do cp "$dll" build/dist/ 2>/dev/null; done || true
          
          # 让 CPack 将 build/dist 目录打包成安装程序
          cd build
          cpack -G NSIS
          echo "=== Generated Installer Size ==="
          ls -la *.exe

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fax-decoder-windows-installer
          path: build/*.exe

      - name: Upload Installer to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.exe
