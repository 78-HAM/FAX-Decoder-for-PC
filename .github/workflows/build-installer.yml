name: Build Windows Installer

on:
  push:
    branches: [ test-cpp ]
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  build-installer:
    name: Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取所有历史

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-nsis

      - name: Configure and Build
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Create Installer
        run: |
          mkdir -p build/dist
          cp build/bin/*.exe build/dist/ 2>/dev/null || cp build/*.exe build/dist/ 2>/dev/null || true
          if [ -d "resources" ]; then cp -r resources build/dist/; fi
          
          ldd build/dist/*.exe 2>/dev/null | awk '/=>/ {print $3}' | grep -i "mingw" | while read dll; do cp "$dll" build/dist/ 2>/dev/null; done || true
          
          cd build
          cpack -G NSIS
          echo "=== Generated Installer Size ==="
          ls -la *.exe

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fax-decoder-windows-installer
          path: build/*.exe

      # 动态获取最新的 Tag
      - name: Get Latest Tag
        id: get_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            # 获取仓库最新的 tag 名
            TAG=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "2.0.0")
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      # 只要编译成功，强制上传到最新 Tag 的 Release
      - name: Upload Installer to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: build/*.exe
