name: Check and Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Syntax + Import + Runtime Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1 xvfb

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy soundfile pillow pyaudio

      - name: Syntax check
        run: |
          python -m py_compile main/Decoder.py
          echo "Syntax OK"

      - name: Import check
        run: |
          python << 'EOF'
          import ast, sys
          src = open('main/Decoder.py', encoding='utf-8').read()
          tree = ast.parse(src)
          mods = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for n in node.names:
                      mods.add(n.name.split('.')[0])
              elif isinstance(node, ast.ImportFrom):
                  if node.module:
                      mods.add(node.module.split('.')[0])
          for m in sorted(mods):
              try:
                  __import__(m)
                  print('OK  ', m)
              except Exception as e:
                  print('FAIL', m, '->', e)
                  sys.exit(1)
          EOF

      - name: Runtime init check (xvfb)
        run: |
          xvfb-run -a python << 'EOF'
          import sys, importlib.util, traceback
          spec = importlib.util.spec_from_file_location('decoder', 'main/Decoder.py')
          mod = importlib.util.module_from_spec(spec)
          sys.modules['decoder'] = mod
          try:
              spec.loader.exec_module(mod)
          except Exception:
              print('=== Module import failed ===')
              traceback.print_exc()
              sys.exit(1)
          if not hasattr(mod, 'FaxDecoderApp'):
              print('FaxDecoderApp class not found')
              sys.exit(1)
          try:
              app = mod.FaxDecoderApp()
              app.root.update_idletasks()
              app.root.update()
              app.root.destroy()
              print('Runtime init OK')
          except Exception:
              print('=== Runtime init failed ===')
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: Simulate menu and setup interactions
        run: |
          xvfb-run -a python << 'EOF'
          import sys, importlib.util, traceback
          spec = importlib.util.spec_from_file_location('decoder', 'main/Decoder.py')
          mod = importlib.util.module_from_spec(spec)
          sys.modules['decoder'] = mod
          spec.loader.exec_module(mod)
          app = mod.FaxDecoderApp()
          app.root.update_idletasks()
          app.root.update()

          try:
              if hasattr(app, '_build_menubar'):
                  app._build_menubar()
                  print('_build_menubar OK')
          except Exception:
              print('=== _build_menubar failed ===')
              traceback.print_exc()
              app.root.destroy()
              sys.exit(1)

          for name in ('show_manual_menu', 'start_skew_calibration', 'start_start_point_calibration'):
              if hasattr(app, name):
                  try:
                      getattr(app, name)()
                      app.root.update_idletasks()
                      app.root.update()
                      print(name, 'OK')
                  except Exception:
                      print('===', name, 'failed ===')
                      traceback.print_exc()
                      app.root.destroy()
                      sys.exit(1)

          app.root.destroy()
          print('Interaction check OK')
          EOF

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            artifact: FAXDecoder-windows-x64.exe
            python_arch: x64

          - os: windows-latest
            target: windows-x86
            artifact: FAXDecoder-windows-x86.exe
            python_arch: x86

          - os: ubuntu-22.04
            target: linux-x64
            artifact: FAXDecoder-linux-x64
            python_arch: x64

          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: FAXDecoder-linux-arm64
            python_arch: arm64

          - os: macos-14
            target: macos-arm64
            artifact: FAXDecoder-macos-arm64
            python_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1 upx-ucl

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install portaudio libsndfile upx

      - name: Install dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          echo "UPX_DIR=C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy soundfile pillow pyinstaller
          pip install pyaudio

      - name: Convert PNG icon to ICO
        run: |
          python << 'EOF'
          from PIL import Image
          Image.open('icon/icon.png').convert('RGBA').save(
              'icon/icon.ico',
              sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]
          )
          EOF

      - name: Build with PyInstaller on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FAXDecoder --icon icon/icon.ico --upx-dir "%UPX_DIR%" --optimize 2 --exclude-module tkinter.test --exclude-module test --exclude-module unittest --exclude-module pydoc --exclude-module doctest main/Decoder.py

      - name: Build with PyInstaller on Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name FAXDecoder \
            --icon icon/icon.ico \
            --upx-dir /usr/bin \
            --strip \
            --optimize 2 \
            --exclude-module tkinter.test \
            --exclude-module test \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            main/Decoder.py

      - name: Build with PyInstaller on macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name FAXDecoder \
            --icon icon/icon.ico \
            --upx-dir $(brew --prefix upx)/bin \
            --strip \
            --optimize 2 \
            --exclude-module tkinter.test \
            --exclude-module test \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            main/Decoder.py

      - name: Prepare artifact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mv dist/FAXDecoder.exe dist/${{ matrix.artifact }}

      - name: Prepare artifact on Linux and macOS
        if: runner.os != 'Windows'
        run: |
          mv dist/FAXDecoder dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Release to latest tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Find latest tag
        id: latest_tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          releases-only: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.latest_tag.outputs.tag }}
          name: "FAX Decoder ${{ steps.latest_tag.outputs.tag }}"
          draft: false
          prerelease: false
          make_latest: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}