name: Check and Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Run Script Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1 xvfb

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy soundfile pillow pyaudio

      - name: Syntax check
        run: |
          python -m py_compile main/Decoder.py
          echo "Syntax OK"

      - name: Run script and kill after timeout
        shell: bash
        run: |
          cat > /tmp/run_check.py << 'PYEOF'
          import subprocess, os, signal, sys

          proc = subprocess.Popen(
              [sys.executable, 'main/Decoder.py'],
              start_new_session=True,
          )

          timeout = 15
          try:
              proc.wait(timeout=timeout)
              print('=== Process exited before timeout ===')
              print('Return code:', proc.returncode)
              if proc.returncode != 0:
                  print('FAILED: script crashed on startup')
                  sys.exit(1)
              print('Script exited cleanly')
          except subprocess.TimeoutExpired:
              print('=== Process alive after %ds ===' % timeout)
              print('GUI launched successfully, killing process group...')
              try:
                  os.killpg(os.getpgid(proc.pid), signal.SIGKILL)
                  print('Process group killed')
              except Exception as e:
                  print('killpg failed:', e)
                  try:
                      proc.kill()
                  except Exception:
                      pass
              try:
                  proc.wait(timeout=5)
              except Exception:
                  pass
              print('Check passed')
          PYEOF
          xvfb-run -a python /tmp/run_check.py

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86
            artifact: FAXDecoder-windows-x86.exe
            python_arch: x86

          - os: windows-latest
            target: windows-x64
            artifact: FAXDecoder-windows-x64.exe
            python_arch: x64

          - os: ubuntu-22.04
            target: linux-x64
            artifact: FAXDecoder-linux-x64
            python_arch: x64

          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: FAXDecoder-linux-arm64
            python_arch: arm64

          - os: macos-15-intel
            target: macos-x64
            artifact: FAXDecoder-macos-x64
            python_arch: x64

          - os: macos-14
            target: macos-arm64
            artifact: FAXDecoder-macos-arm64
            python_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1 upx-ucl

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install portaudio libsndfile upx

      - name: Install dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          echo "UPX_DIR=C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy soundfile pillow pyinstaller
          pip install pyaudio

      - name: Convert PNG icon to ICO
        shell: bash
        run: |
          cat > /tmp/convert_icon.py << 'PYEOF'
          from PIL import Image
          Image.open('icon/icon.png').convert('RGBA').save(
              'icon/icon.ico',
              sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]
          )
          PYEOF
          python /tmp/convert_icon.py

      - name: Build with PyInstaller on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FAXDecoder --icon icon/icon.ico --upx-dir "%UPX_DIR%" --optimize 2 --exclude-module tkinter.test --exclude-module test --exclude-module unittest --exclude-module pydoc --exclude-module doctest main/Decoder.py

      - name: Build with PyInstaller on Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name FAXDecoder \
            --icon icon/icon.ico \
            --upx-dir /usr/bin \
            --strip \
            --optimize 2 \
            --exclude-module tkinter.test \
            --exclude-module test \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            main/Decoder.py

      - name: Build with PyInstaller on macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name FAXDecoder \
            --icon icon/icon.ico \
            --upx-dir $(brew --prefix upx)/bin \
            --strip \
            --optimize 2 \
            --exclude-module tkinter.test \
            --exclude-module test \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            main/Decoder.py

      - name: Prepare artifact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mv dist/FAXDecoder.exe dist/${{ matrix.artifact }}

      - name: Prepare artifact on Linux and macOS
        if: runner.os != 'Windows'
        run: |
          mv dist/FAXDecoder dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Release to latest tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Find latest tag
        id: latest_tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          releases-only: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.latest_tag.outputs.tag }}
          name: "FAX Decoder ${{ steps.latest_tag.outputs.tag }}"
          draft: false
          prerelease: false
          make_latest: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}