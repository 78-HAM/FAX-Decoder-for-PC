name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: windows-x64
            artifact: FAXDecoder-windows-x64.exe
            python_arch: x64

          - os: windows-latest
            target: windows-x86
            artifact: FAXDecoder-windows-x86.exe
            python_arch: x86

          # Linux
          - os: ubuntu-22.04
            target: linux-x64
            artifact: FAXDecoder-linux-x64
            python_arch: x64

          - os: ubuntu-22.04
            target: linux-arm64
            artifact: FAXDecoder-linux-arm64
            python_arch: arm64

          # macOS (仅 ARM64，无 AMD64)
          - os: macos-14
            target: macos-arm64
            artifact: FAXDecoder-macos-arm64
            python_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install portaudio libsndfile

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy soundfile pillow pyinstaller
          pip install pyaudio

      - name: Convert PNG icon to ICO
        run: |
          python -c "from PIL import Image; Image.open('icon/icon.png').convert('RGBA').save('icon/icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed ^
            --name FAXDecoder ^
            --icon icon/icon.ico ^
            --exclude-module tkinter.test ^
            --exclude-module test ^
            --exclude-module unittest ^
            --exclude-module pydoc ^
            --exclude-module doctest ^
            --exclude-module email ^
            --exclude-module http ^
            --exclude-module xml ^
            --exclude-module pickle ^
            --exclude-module sqlite3 ^
            --exclude-module multiprocessing ^
            --exclude-module asyncio ^
            main/Decoder.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name FAXDecoder \
            --icon icon/icon.ico \
            --exclude-module tkinter.test \
            --exclude-module test \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --exclude-module email \
            --exclude-module http \
            --exclude-module xml \
            --exclude-module pickle \
            --exclude-module sqlite3 \
            --exclude-module multiprocessing \
            --exclude-module asyncio \
            main/Decoder.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name FAXDecoder \
            --icon icon/icon.ico \
            --exclude-module tkinter.test \
            --exclude-module test \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --exclude-module email \
            --exclude-module http \
            --exclude-module xml \
            --exclude-module pickle \
            --exclude-module sqlite3 \
            --exclude-module multiprocessing \
            --exclude-module asyncio \
            main/Decoder.py

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mv dist/FAXDecoder.exe dist/${{ matrix.artifact }}

      - name: Prepare artifact (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mv dist/FAXDecoder dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.0.0
          name: FAX Decoder 1.0.0
          draft: false
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
